
AWSTemplateFormatVersion: '2010-09-09'

Description: CloudFormation template for CodePipeline test and production environments

Parameters:
  Environment:
    Type: String
    Description: Select deployment environment
    Default: test
    AllowedValues:
      - test
      - prod

Resources:
  ApplicationBucket:
    Type: AWS::S3::Bucket

Outputs:
  Environment:
    Description: Environment name
    Value: !Ref Environment

  BucketName:
    Description: Created S3 bucket
    Value: !Ref ApplicationBucket
